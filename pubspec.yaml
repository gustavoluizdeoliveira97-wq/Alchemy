name: alchemy
description: Alchemy

publish_to: "none"

version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  app_links: ^6.0.1
  animations: ^2.0.10
  async: ^2.11.0
  audio_service: ^0.18.14
  audio_session: ^0.2.2
  cached_network_image: ^3.3.0
  clipboard: ^2.0.2
  collection: ^1.18.0
  connectivity_plus: ^6.0.2
  country_currency_pickers: ^3.0.0
  crypto: ^3.0.3
  custom_navigator: ^0.3.0
  device_info_plus: ^11.1.0
  draggable_scrollbar: ^0.1.0
  encrypt: ^5.0.3
  envied: ^1.1.1
  external_path: ^2.0.0
  filesize: ^2.0.1
  fluttericon: ^2.0.0
  fluttertoast: ^8.2.4
  flutter_cache_manager: ^3.3.1
  flutter_displaymode: ^0.6.0
  flutter_inappwebview: ^6.1.0+1
  flutter_local_notifications: ^19.2.1
  markdown_widget: ^2.3.2+8
  flutter_material_color_picker: ^1.2.0
  flutter_screenutil: ^5.9.0
  get_it: ^8.0.0
  google_fonts: ^6.1.0
  html: ^0.15.3
  http: ^1.2.1
  i18n_extension: ^15.0.4
  intl: ^0.20.2
  image_picker: ^1.1.2
  json_annotation: ^4.9.0
  just_audio: ^0.10.3
  logging: ^1.2.0
  marquee: ^2.2.3
  move_to_background: ^1.0.2
  numberpicker: ^2.1.2
  package_info_plus: ^8.0.0
  path: ^1.8.3
  path_provider: ^2.1.1
  permission_handler: ^12.0.0+1
  photo_view: ^0.15.0
  pointycastle: ^3.9.1
  quick_actions: ^1.0.6
  rxdart: ^0.28.0
  scrobblenaut: any
  share_plus: ^11.0.0
  spotify: ^0.13.1
  sqflite: ^2.4.2
  url_launcher: ^6.2.2
  visibility_detector: ^0.4.0+2
  wakelock_plus: ^1.2.10
  lottie: ^3.1.3
  awesome_ripple_animation: ^2.0.0
  liquid_progress_indicator_v2: ^0.5.0
  figma_squircle: ^0.6.2
  open_filex: ^4.7.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  json_serializable: ^6.7.1
  build_runner: ^2.4.7
  flutter_lints: ^6.0.0
  envied_generator: ^1.1.1

flutter:
  uses-material-design: true

  assets:
    - lib/.env
    - assets/cover.jpg
    - assets/cover_thumb.jpg
    - assets/artist.jpg
    - assets/artist_thumb.jpg
    - assets/banner.png
    - assets/icon_legacy.png
    - assets/icon.png
    - assets/favorites_thumb.jpg
    - assets/browse_icon.png
    - assets/DJDoubleD.jpg
    - assets/PetitPrince.png
    - assets/chrome.png
    - assets/token.png
    - assets/deezer.png
    - assets/lrclib.png
    - assets/lyricfind.png
    - assets/animations/bubbles.json
    - assets/animations/logo_closing.json
    - assets/animations/welcome_waves.json
    - assets/animations/playing_wave.json
    - assets/animations/pausing_wave.json

  fonts:
    - family: AlchemyIcons
      fonts:
        - asset: assets/fonts/AlchemyIcons.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 100
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Extrabold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Extrabold.ttf
          weight: 900
